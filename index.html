<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonificación Consumos</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #16a34a;
            --success-hover: #15803d;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-counter {
            background-color: #e2e8f0;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: bold;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-counter:hover {
            background-color: #cbd5e1;
        }

        .counter-display {
            flex: 1;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            background-color: #f1f5f9;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Botón de Guardar Destacado */
        .save-container {
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-save {
            background-color: var(--success-color);
            color: white;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
        .btn-save:hover {
            background-color: var(--success-hover);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #f1f5f9;
            color: var(--danger-color);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            padding: 10px;
        }
        .btn-danger:hover {
            background-color: #fee2e2;
        }

        /* Sección de Historial */
        .history-section {
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .history-table th, .history-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        .history-table th {
            background-color: #f1f5f9;
        }

        /* Estilos específicos para impresión / PDF */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .btn-counter, .save-container, .history-section button {
                display: none !important;
            }
            input, select {
                border: none;
                background: transparent;
                padding: 0;
                font-size: 1rem;
            }
            .counter-display {
                border: none;
                background: transparent;
                text-align: left;
                padding: 0;
            }
            .history-table {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tonificación Consumos</h1>
        
        <form id="consumptionForm">
            <!-- Número de Orden -->
            <div class="form-group">
                <label for="orderNumber">Número de Orden</label>
                <input type="text" id="orderNumber" placeholder="Ej. ORD-2026-001" required>
            </div>

            <!-- Técnico -->
            <div class="form-group">
                <label for="technician">Técnico</label>
                <input type="text" id="technician" placeholder="Nombre del técnico..." required>
            </div>

            <!-- Sustrato -->
            <div class="form-group">
                <label for="substrate">Sustrato</label>
                <select id="substrate" required>
                    <option value="" disabled selected>Selecciona un sustrato...</option>
                    <option value="alveo">Alveo</option>
                    <option value="anticato">Anticato</option>
                    <option value="apomazado">Apomazado</option>
                    <option value="arenisca">Arenisca</option>
                    <option value="lineal">Lineal</option>
                    <option value="pausa">Pausa</option>
                    <option value="piano">Piano</option>
                    <option value="prisma">Prisma</option>
                    <option value="rústico">Rústico</option>
                </select>
            </div>

            <!-- Nombre de Gráfica -->
            <div class="form-group">
                <label for="graphicName">Nombre de Gráfica</label>
                <input type="text" id="graphicName" placeholder="Escribe el nombre de la gráfica..." required>
            </div>

            <!-- Fecha (Modificable) -->
            <div class="form-group">
                <label for="dateField">Fecha de Sesión</label>
                <input type="date" id="dateField" required>
            </div>

            <!-- Cantidad Planchas No OK -->
            <div class="form-group">
                <label>Cantidad Planchas No OK (de hoy)</label>
                <div class="counter-container">
                    <button type="button" class="btn-counter" onclick="adjustCount('nok', -1)">-</button>
                    <div id="countNok" class="counter-display">0</div>
                    <button type="button" class="btn-counter" onclick="adjustCount('nok', 1)">+</button>
                </div>
            </div>

            <!-- Cantidad Planchas OK -->
            <div class="form-group">
                <label>Cantidad Planchas OK (de hoy)</label>
                <div class="counter-container">
                    <button type="button" class="btn-counter" onclick="adjustCount('ok', -1)">-</button>
                    <div id="countOk" class="counter-display">0</div>
                    <button type="button" class="btn-counter" onclick="adjustCount('ok', 1)">+</button>
                </div>
            </div>

            <!-- BOTÓN DE GUARDAR DESTACADO -->
            <div class="save-container">
                <button type="button" class="btn btn-save" onclick="saveSession()">💾 GUARDAR REGISTRO DE HOY</button>
            </div>
        </form>

        <!-- Historial de días guardados -->
        <div class="history-section">
            <h3 style="margin-bottom: 10px; font-size: 1.1rem;">Historial de Consumos Guardados</h3>
            <div id="historyContainer">
                <p style="font-size: 0.9rem; color: #64748b;">No hay registros guardados todavía.</p>
            </div>

            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button type="button" class="btn btn-primary" onclick="generatePDF()">📄 Generar Informe PDF Acumulado</button>
                <button type="button" class="btn btn-danger" onclick="clearHistory()">🗑️ Borrar Todo / Nuevo Pedido</button>
            </div>
        </div>
    </div>

    <script>
        let counts = { ok: 0, nok: 0 };
        let historyData = [];

        // Cargar datos guardados al iniciar la página
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateField').value = today;

            const savedOrder = localStorage.getItem('ton_order');
            const savedTech = localStorage.getItem('ton_tech');
            const savedSubstrate = localStorage.getItem('ton_substrate');
            const savedGraphic = localStorage.getItem('ton_graphic');
            const savedHistory = localStorage.getItem('ton_history');

            if (savedOrder) document.getElementById('orderNumber').value = savedOrder;
            if (savedTech) document.getElementById('technician').value = savedTech;
            if (savedSubstrate) document.getElementById('substrate').value = savedSubstrate;
            if (savedGraphic) document.getElementById('graphicName').value = savedGraphic;
            
            if (savedHistory) {
                historyData = JSON.parse(savedHistory);
                renderHistory();
            }
        });

        // Ajustar contadores (+ / -)
        function adjustCount(type, amount) {
            counts[type] += amount;
            if (counts[type] < 0) counts[type] = 0;
            document.getElementById(`count${type.charAt(0).toUpperCase() + type.slice(1)}`).innerText = counts[type];
        }

        // Guardar la sesión del día actual
        function saveSession() {
            const order = document.getElementById('orderNumber').value;
            const technician = document.getElementById('technician').value;
            const substrate = document.getElementById('substrate').value;
            const graphicName = document.getElementById('graphicName').value;
            const date = document.getElementById('dateField').value;

            if (!order || !technician || !substrate || !graphicName || !date) {
                alert('Por favor, rellena los campos principales (Orden, Técnico, Sustrato, Gráfica y Fecha) antes de guardar.');
                return;
            }

            if (counts.ok === 0 && counts.nok === 0) {
                if (!confirm('Los contadores de planchas OK y NO OK están a 0. ¿Deseas guardar de todas formas?')) {
                    return;
                }
            }

            // Guardar datos generales en memoria para que no haya que reescribirlos
            localStorage.setItem('ton_order', order);
            localStorage.setItem('ton_tech', technician);
            localStorage.setItem('ton_substrate', substrate);
            localStorage.setItem('ton_graphic', graphicName);

            // Añadir al historial
            const newEntry = {
                date: date,
                ok: counts.ok,
                nok: counts.nok
            };

            historyData.push(newEntry);
            localStorage.setItem('ton_history', JSON.stringify(historyData));

            renderHistory();

            // Resetear contadores a 0 para el siguiente día
            counts = { ok: 0, nok: 0 };
            document.getElementById('countOk').innerText = '0';
            document.getElementById('countNok').innerText = '0';

            alert('¡Registro de hoy guardado correctamente en el historial!');
        }

        // Mostrar el historial en pantalla
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyData.length === 0) {
                container.innerHTML = '<p style="font-size: 0.9rem; color: #64748b;">No hay registros guardados todavía.</p>';
                return;
            }

            let totalOk = 0;
            let totalNok = 0;

            let html = `<table class="history-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Planchas OK</th>
                        <th>Planchas NO OK</th>
                    </tr>
                </thead>
                <tbody>`;

            historyData.forEach(item => {
                totalOk += item.ok;
                totalNok += item.nok;
                html += `<tr>
                    <td>${item.date}</td>
                    <td>${item.ok}</td>
                    <td>${item.nok}</td>
                </tr>`;
            });

            html += `</tbody>
                <tfoot>
                    <tr style="font-weight: bold; background-color: #e2e8f0;">
                        <td>TOTALES ACUMULADOS</td>
                        <td>${totalOk}</td>
                        <td>${totalNok}</td>
                    </tr>
                </tfoot>
            </table>`;

            container.innerHTML = html;
        }

        // Generar PDF sumando todos los días
        function generatePDF() {
            if (historyData.length === 0) {
                alert('No hay ningún registro guardado en el historial para generar el informe.');
                return;
            }
            window.print();
        }

        // Borrar historial y datos guardados
        function clearHistory() {
            if (confirm('¿Estás seguro de que quieres borrar todo el historial y empezar un nuevo pedido?')) {
                localStorage.clear();
                historyData = [];
                counts = { ok: 0, nok: 0 };
                document.getElementById('consumptionForm').reset();
                document.getElementById('countOk').innerText = '0';
                document.getElementById('countNok').innerText = '0';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('dateField').value = today;
                renderHistory();
            }
        }
    </script>
</body>
</html>
